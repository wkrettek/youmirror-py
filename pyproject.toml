[project]
name = "youmirror"
version = "0.5.1"
description = "Create a mirror filetree of your favorite youtube videos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "tomlkit==0.13.3",
    "typer==0.15.4",
    "yt-dlp[default]>=2026.10.21",
]

[project.scripts]
youmirror = "youmirror.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
